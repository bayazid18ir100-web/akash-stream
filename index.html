<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07122b">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Akash Stream</title>
<style>
:root{--bg:#07122b;--card:#0e1f45;--line:#1c3366;--tx:#eaf2ff;--mut:#8ea6d1;--cy:#22d3ee;--or:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;max-width:100vw;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:8px 12px}
header .brand{display:flex;align-items:center;gap:8px;flex:1}
header img{height:36px;width:auto;max-width:100%}
header h1{font-size:0;line-height:0;margin:0}
header h1 span{color:var(--cy)}
.ib{background:none;border:0;font-size:22px;padding:4px 7px;line-height:1}
.player{background:#000;position:relative;aspect-ratio:16/9;width:100%;max-height:44vh}
video{width:100%;height:100%;background:#000}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut);pointer-events:none}
.msg img{width:64px;height:64px;border-radius:16px}
.now{padding:6px 14px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line)}
.now b{color:var(--tx)}
.nowbar{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-right:8px}
.nowbar .now{flex:1;min-width:0;border:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nb{flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:34px;padding:0;border-radius:10px}
.nb svg{width:20px;height:20px}
body.pip header,body.pip .nowbar,body.pip .now,body.pip main,body.pip .fab{display:none}
body.pip .player{max-height:100vh}
.sb{display:none;padding:8px 12px 0}
.sb.show{display:flex}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input{flex:1;min-width:0}
button{cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:10px 12px 90px}
.tot{font-size:17px;font-weight:700;color:var(--cy);margin:4px 2px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{border-radius:14px;padding:9px 16px;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:linear-gradient(90deg,var(--cy),#3b82f6);color:#04122b;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.card{cursor:pointer;position:relative;text-align:center;min-width:0}
.lg{background:var(--card);border:1px solid var(--line);border-radius:14px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card.on .lg{border:2px solid var(--cy);box-shadow:0 0 0 2px rgba(34,211,238,.3)}
.lg img{width:72%;height:72%;object-fit:contain}
.lg .ph{font-size:28px;font-weight:700;color:var(--cy)}
.card .n{font-size:11.5px;margin-top:5px;line-height:1.25;height:29px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fv{position:absolute;top:2px;right:4px;background:none;border:0;padding:0;font-size:16px;color:var(--mut);z-index:2;text-shadow:0 1px 2px #000;line-height:1}
.fv.on{color:#ff3b5c}
.ad{display:flex;gap:8px;justify-content:center}
.ad button{background:none;border:0;padding:0;font-size:11px;color:#ff6b6b}
.ad button.e{color:var(--cy)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--cy),#3b82f6);color:#04122b;font-size:30px;font-weight:700;border:0;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:40;padding:0}
.fab.show{display:flex}
#admin{display:none;margin:10px 12px 100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#admin h3{margin:0 0 10px}
textarea{width:100%;min-height:120px;margin:8px 0;font-family:ui-monospace,monospace;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.empty{color:var(--mut);padding:20px 4px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top">
<header>
<div class="brand"><img src="logo.svg" alt="Akash Stream"><h1>Akash Stream</h1></div>
<button class="ib" id="sBtn" aria-label="Search">🔍</button>
<button class="ib" id="hBtn" aria-label="Favourites">❤️</button>
<button class="ib" id="aBtn" aria-label="Admin">⚙️</button>
</header>
<div class="player"><video id="v" controls playsinline></video><div class="msg" id="msg"><img src="mark.svg" alt=""><div>Welcome to Akash Stream<br>Select a channel</div></div></div>
<div class="nowbar"><div class="now" id="now">Nothing is playing</div>
<button class="nb" id="prevBtn" aria-label="Previous channel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
<button class="nb" id="nextBtn" aria-label="Next channel"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
</div>
<div class="sb" id="sb"><input id="q" name="channel-search" placeholder="Search channels..." autocomplete="off"></div>
</div>

<main>
<div class="tot" id="tot"></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
</main>

<div id="admin">
<div id="loginBox">
<h3>Admin Login</h3>
<div class="bar"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"></div>
<label style="display:block;margin:6px 0;font-size:13px;color:var(--mut)"><input type="checkbox" id="showpw" style="flex:none"> Show password</label>
<button id="loginBtn">Login</button> <button id="googleLoginBtn" type="button">Login with Google</button> <span id="lerr" style="color:#ff6b6b"></span>
</div>
<div id="panel" class="hide">
<h3>Playlist import (m3u)</h3>
<div class="bar"><input id="lnk" placeholder="m3u link (optional)"><button id="ldBtn">Load</button></div>
<div class="bar"><input id="m3uFile" type="file" accept=".m3u,.m3u8,.txt,text/plain,*/*"></div>
<textarea id="m3u" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;https://...png&quot; group-title=&quot;Sports&quot;,Channel Name&#10;https://example.com/stream.m3u8"></textarea>
<div class="bar">
<select id="icty"><option value="AUTO">Country: Auto-detect</option><option value="BD">Country: Bangladesh</option><option value="IN">Country: India</option></select>
<select id="icat"><option value="">Category: Auto</option><option>Sports</option><option>News</option><option>Entertainment</option><option>Kids</option><option>Movies</option><option>Music</option></select>
</div>
<div class="bar">
<button id="logoBtn">Auto-fill missing logos</button><button id="ctyBtn">Auto-detect country</button><span id="logoMsg" style="color:var(--mut);font-size:12px;align-self:center"></span>
</div>
<div class="bar">
<button id="imp">Import</button>
<button id="clr">Delete all channels</button>
<button id="out">Logout</button>
</div>
<p style="color:var(--mut);font-size:12px;margin:6px 0 0">If the playlist has tvg-logo, logos are added automatically. To change a channel's logo, category or country, tap Edit under the channel.</p>
</div>
</div>
<button class="fab" id="fab" aria-label="Admin panel">+</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,onSnapshot,query,orderBy,doc,writeBatch,deleteDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyA9bFp2qYTdWrTiX-rfs1KCUS2PEB-3OY8",
  authDomain:"akash-stream.firebaseapp.com",
  projectId:"akash-stream",
  storageBucket:"akash-stream.firebasestorage.app",
  messagingSenderId:"237310635286",
  appId:"1:237310635286:web:5a998de465cd9d5dbdb437"
};

const ADMIN_EMAIL="bayazid18ir100@gmail.com";
// Paste your Cloudflare Worker address here (no trailing slash). Example: "https://akash-proxy.yourname.workers.dev"
const PROXY="https://akashproxy.bayazid18ir100.workers.dev";
const CATS=["Sports","News","Entertainment","Kids","Movies","Music"];
const KEYS=["All","Favourites","Sports","Bangladesh","India","News","Entertainment","Kids","Movies","Music","HTTPS only"];
const $=i=>document.getElementById(i);
let chans=[],favs=[],tab="All",cur=null,hls=null,isAdmin=false;
try{favs=JSON.parse(localStorage.getItem("as_fav")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("as_fav",JSON.stringify(favs))}catch(e){}};

const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app);
const col=collection(db,"channels");

onSnapshot(query(col,orderBy("name")),s=>{
  chans=s.docs.map(d=>({id:d.id,...d.data()}));render();
},()=>{$("grid").innerHTML='<div class="empty">Failed to load channels. Check your internet and Firestore rules.</div>'});

onAuthStateChanged(auth,u=>{
  isAdmin=!!u&&(u.email||"").toLowerCase()===ADMIN_EMAIL;
  if(u&&!isAdmin){$("lerr").textContent="This account does not have admin access";signOut(auth)}
  $("loginBox").classList.toggle("hide",isAdmin);
  $("panel").classList.toggle("hide",!isAdmin);
  $("fab").classList.toggle("show",isAdmin);
  render();
});

function mapCat(g){g=(g||"").toLowerCase();
  if(/sport|cricket|football/.test(g))return"Sports";
  if(/news/.test(g))return"News";
  if(/kid|cartoon/.test(g))return"Kids";
  if(/movie|film|cinema/.test(g))return"Movies";
  if(/music/.test(g))return"Music";
  return"Entertainment"}
function hid(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return"c"+h.toString(36)}
function detectCty(name,group,tvgid){
  const t=(name||"")+" "+(group||"");
  if(t.includes("\u{1F1E7}\u{1F1E9}"))return"BD";
  if(t.includes("\u{1F1EE}\u{1F1F3}"))return"IN";
  const id=(tvgid||"").toLowerCase();
  if(/\.bd$/.test(id))return"BD";
  if(/\.in$/.test(id))return"IN";
  const g=(group||"").toLowerCase();
  if(/bangladesh|\bbd\b/.test(g))return"BD";
  if(/\bindia\b/.test(g))return"IN";
  return null}
function parse(text,cty,forceCat){
  const out=[];let meta=null;
  text.split(/\r?\n/).forEach(raw=>{const l=raw.trim();
    if(l.startsWith("#EXTINF")){
      const g=l.match(/group-title="([^"]*)"/);
      const lg=l.match(/tvg-logo="([^"]*)"/);
      const tid=l.match(/tvg-id="([^"]*)"/);
      const i=l.lastIndexOf(",");
      const nm=(i>=0?l.slice(i+1).trim():"")||"Channel";
      meta={name:nm,cat:forceCat||mapCat((g?g[1]:"")+" "+nm),logo:lg?lg[1]:"",cty:detectCty(nm,g?g[1]:"",tid?tid[1]:"")};
    }else if(l&&l[0]!=="#"&&meta){out.push({name:meta.name,cat:meta.cat,cty:cty==="AUTO"?meta.cty:cty,url:l,logo:meta.logo});meta=null}
  });
  return out}

function match(k,c){
  if(k==="All")return true;
  if(k==="Favourites")return favs.includes(c.url);
  if(k==="Bangladesh")return c.cty==="BD";
  if(k==="India")return c.cty==="IN";
  if(k==="HTTPS only")return (c.url||"").startsWith("https://");
  return c.cat===k}

function renderTabs(){
  const t=$("tabs"),sc=t.scrollLeft;t.innerHTML="";
  KEYS.forEach(k=>{
    const n=chans.filter(c=>match(k,c)).length;
    const b=document.createElement("button");b.className="chip"+(k===tab?" on":"");
    b.textContent=(k==="Favourites"?"♥ ":"")+k+" ("+n+")";
    b.onclick=()=>{tab=k;render()};t.appendChild(b)});
  t.scrollLeft=sc}

function card(c){
  const d=document.createElement("div");d.className="card"+(cur&&cur.url===c.url?" on":"");
  const lg=document.createElement("div");lg.className="lg";
  const ph=()=>{lg.innerHTML="";const p=document.createElement("div");p.className="ph";p.textContent=(c.name||"?").trim().charAt(0).toUpperCase();lg.appendChild(p)};
  if(c.logo&&/^https?:/.test(c.logo)){
    const im=document.createElement("img");im.loading="lazy";im.referrerPolicy="no-referrer";im.alt="";im.src=c.logo;im.onerror=ph;lg.appendChild(im);
  }else ph();
  const f=document.createElement("button");const isF=favs.includes(c.url);f.className="fv"+(isF?" on":"");f.textContent=isF?"♥":"♡";
  f.onclick=e=>{e.stopPropagation();const i=favs.indexOf(c.url);if(i>-1)favs.splice(i,1);else favs.push(c.url);saveFavs();render()};
  const n=document.createElement("div");n.className="n";n.textContent=c.name;
  d.append(lg,f,n);
  if(isAdmin){
    const a=document.createElement("div");a.className="ad";
    const e=document.createElement("button");e.className="e";e.textContent="Edit";e.onclick=ev=>{ev.stopPropagation();editCh(c)};
    const x=document.createElement("button");x.textContent="Delete";x.onclick=async ev=>{ev.stopPropagation();if(!confirm("Delete this channel?"))return;try{await deleteDoc(doc(db,"channels",c.id))}catch(er){alert("Delete failed")}};
    a.append(e,x);d.append(a);
  }
  d.onclick=()=>play(c);
  return d}

function visible(){
  const q=$("q").value.toLowerCase().trim();
  return chans.filter(c=>match(tab,c)&&(c.name||"").toLowerCase().includes(q))}

function render(){
  const g=$("grid");
  $("tot").textContent="Total Channels: "+chans.length;
  renderTabs();
  g.innerHTML="";
  const list=visible();
  if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No channels found.</div>';return}
  list.forEach(c=>g.appendChild(card(c)))}

async function editCh(c){
  const name=prompt("Channel name",c.name);if(name===null)return;
  const cat=prompt("Category: "+CATS.join(", "),c.cat);if(cat===null)return;
  const cty=prompt("Country: BD or IN",c.cty);if(cty===null)return;
  const logo=prompt("Logo link (leave empty for no logo)",c.logo||"");if(logo===null)return;
  try{await setDoc(doc(db,"channels",c.id),{name:name.trim()||c.name,cat:CATS.includes(cat.trim())?cat.trim():c.cat,cty:cty.trim().toUpperCase()==="IN"?"IN":"BD",url:c.url,logo:logo.trim()})}
  catch(e){alert("Edit failed")}}

function play(c){
  cur=c;const v=$("v");
  $("msg").style.display="none";
  $("now").innerHTML="Playing: <b></b>";$("now").querySelector("b").textContent=c.name;
  if(hls){hls.destroy();hls=null}
  const fail=t=>{$("msg").style.display="flex";$("msg").textContent=t};
  const httpOnly=location.protocol==="https:"&&c.url.startsWith("http://");
  const playUrl=(httpOnly&&PROXY)?PROXY+"/?url="+encodeURIComponent(c.url):c.url;
  const failMsg=(httpOnly&&!PROXY)?"This stream is http-only, which browsers block on https sites. Try another channel or a backup.":"Stream failed to load";
  v.onerror=()=>fail(failMsg);
  if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(c.url)){
    hls=new Hls();hls.loadSource(playUrl);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail(failMsg)});
  }else{v.src=playUrl;v.play().catch(()=>{})}
  render()}

function step(dir){
  const list=visible();
  if(!list.length)return;
  let i=cur?list.findIndex(c=>c.url===cur.url):-1;
  if(i<0)i=dir>0?-1:0;
  play(list[(i+dir+list.length)%list.length]);
  const el=document.querySelector(".card.on");
  if(el)el.scrollIntoView({block:"center",behavior:"smooth"})}
$("prevBtn").onclick=()=>step(-1);
$("nextBtn").onclick=()=>step(1);

$("q").oninput=render;
$("sBtn").onclick=()=>{const s=$("sb");s.classList.toggle("show");if(s.classList.contains("show"))$("q").focus();else{$("q").value="";render()}};
$("hBtn").onclick=()=>{tab="Favourites";render();window.scrollTo(0,0)};
const toggleAdmin=()=>{const a=$("admin");a.style.display=a.style.display==="block"?"none":"block";if(a.style.display==="block")a.scrollIntoView({behavior:"smooth"})};
$("aBtn").onclick=toggleAdmin;$("fab").onclick=toggleAdmin;

$("loginBtn").onclick=async()=>{
  $("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(e){$("lerr").textContent="Login failed ("+(e.code||e.message)+")"}};
const gProvider=new GoogleAuthProvider();
gProvider.setCustomParameters({prompt:"select_account"});
$("googleLoginBtn").onclick=async()=>{
  $("lerr").textContent="";
  try{await signInWithPopup(auth,gProvider)}
  catch(e){
    if(e.code==="auth/popup-blocked"){try{await signInWithRedirect(auth,gProvider)}catch(e2){$("lerr").textContent="Google login failed ("+(e2.code||e2.message)+")"}}
    else if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request"){$("lerr").textContent="Google login failed ("+(e.code||e.message)+")"}
  }};
getRedirectResult(auth).catch(e=>{$("lerr").textContent="Google login failed ("+(e.code||e.message)+")"});
$("out").onclick=()=>signOut(auth);
$("m3uFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{$("m3u").value=await f.text()}catch(er){alert("Could not read the file")}};
$("showpw").onchange=e=>{$("pw").type=e.target.checked?"text":"password"};

$("ldBtn").onclick=async()=>{
  try{const r=await fetch($("lnk").value.trim());if(!r.ok)throw 0;$("m3u").value=await r.text()}
  catch(e){alert("Could not load from the link (it may be blocked by CORS). Paste the m3u text instead.")}};

// ===== Database helpers (iptv-org: public channel list with countries and logos) =====
const dbCache={};
async function getDb(name){
  if(!dbCache[name]){
    const r=await fetch("https://iptv-org.github.io/api/"+name+".json");
    if(!r.ok)throw new Error(name+" download failed");
    dbCache[name]=await r.json()}
  return dbCache[name]}
const normName=s=>(s||"").toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)/g,"").replace(/[^\p{L}\p{N}]/gu,"");
const stripTv=k=>{let r=k;while(/(tv|hd)$/.test(r)&&r.length>3)r=r.replace(/(tv|hd)$/,"");return r};
const digitsOf=k=>(k.match(/\d+/g)||[]).join("-");
function editDist(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]}
function buildLogoMatcher(chs,lgs){
  const best={};
  (lgs||[]).forEach(l=>{
    if(!l.url||!/^https:\/\//.test(l.url))return;
    const o=best[l.channel];
    if(!o||(o.format==="SVG"&&l.format!=="SVG"))best[l.channel]=l});
  const idx=new Map(),keys=[];
  const add=(k,ch)=>{if(!k||k.length<2)return;const a=idx.get(k);if(a)a.push(ch);else{idx.set(k,[ch]);keys.push(k)}};
  chs.forEach(ch=>{
    [ch.name].concat(ch.alt_names||[]).forEach(n=>{const k=normName(n);add(k,ch);const t=stripTv(k);if(t!==k)add(t,ch)})});
  return function(name,cty){
    const k=normName(name),t=stripTv(k);
    if(!k)return null;
    let arr=idx.get(k)||idx.get(t),exact=!!arr;
    if(!arr&&k.length>=7){
      for(const key of keys){
        if(key[0]!==k[0]||Math.abs(key.length-k.length)>1)continue;
        if(digitsOf(key)!==digitsOf(k))continue;
        if(editDist(key,k)<=1){arr=idx.get(key);break}}}
    if(!arr)return null;
    const wl=arr.filter(x=>best[x.id]);
    const pl=wl.find(x=>x.country===cty)||wl[0];
    const cs=Array.from(new Set(arr.map(x=>x.country)));
    return {logo:pl?best[pl.id].url:null,country:cs.length===1?cs[0]:null,exact}}}

$("logoBtn").onclick=async()=>{
  const st=$("logoMsg"),btn=$("logoBtn");
  const missing=chans.filter(c=>!c.logo);
  if(!missing.length){st.textContent="All channels already have logos.";return}
  btn.disabled=true;st.textContent="Downloading logo database...";
  try{
    const [chs,lgs]=await Promise.all([getDb("channels"),getDb("logos")]);
    st.textContent="Matching "+missing.length+" channels...";
    const find=buildLogoMatcher(chs,lgs);
    const found=[];
    missing.forEach(c=>{const r=find(c.name,c.cty);if(r&&r.logo)found.push({id:c.id,logo:r.logo})});
    for(let i=0;i<found.length;i+=400){
      const w=writeBatch(db);
      found.slice(i,i+400).forEach(f=>w.update(doc(db,"channels",f.id),{logo:f.logo}));
      await w.commit()}
    st.textContent="Done: logos added to "+found.length+" of "+missing.length+" channels. Use Edit for the rest.";
  }catch(e){st.textContent="Failed: "+(e.message||e)}
  btn.disabled=false};

$("ctyBtn").onclick=async()=>{
  const st=$("logoMsg"),btn=$("ctyBtn");
  btn.disabled=true;st.textContent="Downloading channel database...";
  try{
    const find=buildLogoMatcher(await getDb("channels"),[]);
    const changes=[];
    chans.forEach(c=>{
      let n=detectCty(c.name,"","");
      if(!n){const r=find(c.name,c.cty);if(r&&r.exact&&(r.country==="BD"||r.country==="IN"))n=r.country}
      if(n&&n!==c.cty)changes.push({id:c.id,cty:n})});
    for(let i=0;i<changes.length;i+=400){
      const w=writeBatch(db);
      changes.slice(i,i+400).forEach(f=>w.update(doc(db,"channels",f.id),{cty:f.cty}));
      await w.commit()}
    st.textContent="Done: country corrected for "+changes.length+" of "+chans.length+" channels. Use Edit for the rest.";
  }catch(e){st.textContent="Failed: "+(e.message||e)}
  btn.disabled=false};

$("imp").onclick=async()=>{
  const items=parse($("m3u").value,$("icty").value,$("icat").value);
  if(!items.length)return alert("No channels found in the playlist");
  $("imp").disabled=true;
  try{
    const unk=items.filter(c=>!c.cty);
    if(unk.length){
      let find=null;
      try{find=buildLogoMatcher(await getDb("channels"),[])}catch(e){}
      unk.forEach(c=>{let n="BD";if(find){const r=find(c.name,"BD");if(r&&r.exact&&(r.country==="BD"||r.country==="IN"))n=r.country}c.cty=n})}
    for(let i=0;i<items.length;i+=400){
      const b=writeBatch(db);
      items.slice(i,i+400).forEach(c=>b.set(doc(db,"channels",hid(c.url)),c));
      await b.commit();
    }
    $("m3u").value="";alert(items.length+" channels added");
  }catch(e){alert("Import failed: "+(e.message||e))}
  $("imp").disabled=false};

$("clr").onclick=async()=>{
  if(!confirm("Delete all channels?"))return;
  try{for(let i=0;i<chans.length;i+=400){const b=writeBatch(db);chans.slice(i,i+400).forEach(c=>b.delete(doc(db,"channels",c.id)));await b.commit()}}
  catch(e){alert("Could not delete")}};

render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
