<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07122b">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

<link rel="icon" href="icon.svg">

<title>Akash Stream</title>
<style>
:root{--bg:#07122b;--card:#0e1f45;--line:#1c3366;--tx:#eaf2ff;--mut:#8ea6d1;--cy:#22d3ee;--or:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;max-width:100vw;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:8px 12px}
header .brand{display:flex;align-items:center;gap:8px;flex:1}
header img{height:36px;width:auto;max-width:100%}
header h1{font-size:0;line-height:0;margin:0}
header h1 span{color:var(--cy)}
.ib{background:none;border:0;font-size:22px;padding:4px 7px;line-height:1}
.player{background:#000;position:relative;aspect-ratio:16/9;width:100%;max-height:44vh}
video{width:100%;height:100%;background:#000;object-fit:var(--vfit,contain)}
.hud{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:8px 14px;display:none;align-items:center;gap:8px;z-index:7;font-size:15px;pointer-events:none}.hud.on{display:flex}.hud i{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;display:block}.hud b{display:block;height:100%;background:#22d3ee}
.pbtn{position:absolute;top:8px;left:8px;z-index:6;display:flex;gap:8px}
.fitb{width:38px;height:38px;border-radius:10px;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;opacity:.6;display:none;align-items:center;justify-content:center;cursor:pointer}
body.land.playing .fitb,.fitb.fsb{display:flex}
.player:fullscreen{max-height:none;width:100vw;height:100vh;aspect-ratio:auto;background:#000}
.player:-webkit-full-screen{max-height:none;width:100vw;height:100vh;aspect-ratio:auto;background:#000}
.player:fullscreen #fitBtn{display:flex}
.player:-webkit-full-screen #fitBtn{display:flex}
body.tv .pbtn,html.cmode .pbtn{display:none}
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:7;display:none;align-items:center;gap:4px;padding:30px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.78));opacity:0;transition:opacity .2s;pointer-events:none;color:#fff}
html.cmode .cbar{display:flex}
html.cmode .cbar.show{opacity:1;pointer-events:auto}
.cbar button{background:none;border:0;color:#fff;font-size:24px;width:48px;height:44px;border-radius:10px;cursor:pointer;padding:0}
.cbar button:active{background:rgba(255,255,255,.22)}
@media(max-width:520px){.cbar{gap:0;padding:26px 6px 6px}.cbar button{width:40px;height:40px;font-size:20px}.cbar .cn{font-size:12px;padding:0 4px}}
.cbar .cn{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px;padding:0 8px;opacity:.9}
.fitb:active,.fitb:focus{opacity:1}
.msg{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mut);pointer-events:none}
.msg img{width:64px;height:64px;border-radius:16px}
.now{padding:6px 14px;color:var(--mut);font-size:13px;border-bottom:1px solid var(--line)}
.now b{color:var(--tx)}
.nowbar{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-right:8px}
.nowbar .now{flex:1;min-width:0;border:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nb{flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:34px;padding:0;border-radius:10px}
.nb svg{width:20px;height:20px}
.sup{display:none;margin:20px 2px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
body.pip header,body.pip .nowbar,body.pip .now,body.pip main,body.pip .fab,body.pip .sb,body.pip .updbar{display:none!important}
body.land.playing{overflow:hidden}
body.land.playing .top{position:fixed;inset:0;z-index:60;padding:0;background:#000;overflow:hidden}
body.land.playing header,body.land.playing .nowbar,body.land.playing .sb,body.land.playing .fab,body.land.playing .updbar{display:none!important}
html.land,body.land{background:#000}
body.land.playing .player{width:100%;height:100%;max-height:none;aspect-ratio:auto}
body.pip .player{max-height:100vh}
.sb{display:none;padding:8px 12px 0}
.sb.show{display:flex}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input{flex:1;min-width:0}
button{cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:10px 12px 90px}
.tot{font-size:17px;font-weight:700;color:var(--cy);margin:4px 2px 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{border-radius:14px;padding:9px 16px;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:linear-gradient(90deg,var(--cy),#3b82f6);color:#04122b;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:10px 8px}
@media(min-width:700px){body:not(.cs) .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
body.light{--bg:#f1f5fb;--card:#fff;--line:#cdd8ea;--tx:#0b1b3a;--mut:#5a6f94;--cy:#0891b2}
.card.sel .lg{border:2px solid var(--or);box-shadow:0 0 0 2px rgba(255,159,67,.35)}
.mv{display:flex;gap:10px;justify-content:center}.mv button{padding:2px 12px;font-size:13px}
#cloud{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut);margin:0 0 10px}
#modeBar{align-items:center;background:var(--card);border:1px solid var(--or);border-radius:12px;padding:8px;font-size:13px}
.card{cursor:pointer;position:relative;text-align:center;min-width:0}
.lg{background:var(--card);border:1px solid var(--line);border-radius:14px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card.on .lg{border:2px solid var(--cy);box-shadow:0 0 0 2px rgba(34,211,238,.3)}
.lg img{width:72%;height:72%;object-fit:contain}
.lg .ph{font-size:28px;font-weight:700;color:var(--cy)}
.card .n{font-size:11.5px;margin-top:5px;line-height:1.25;height:29px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fv{position:absolute;top:2px;right:4px;background:none;border:0;padding:0;font-size:16px;color:var(--mut);z-index:2;text-shadow:0 1px 2px #000;line-height:1}
.fv.on{color:#ff3b5c}
.ad{display:flex;gap:8px;justify-content:center}
.ad button{background:none;border:0;padding:0;font-size:11px;color:#ff6b6b}
.ad button.e{color:var(--cy)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--cy),#3b82f6);color:#04122b;font-size:30px;font-weight:700;border:0;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:40;padding:0}
.fab.show{display:flex}
#admin{display:none;margin:10px 12px 100px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
#admin h3{margin:0 0 10px}
textarea{width:100%;min-height:120px;margin:8px 0;font-family:ui-monospace,monospace;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.empty{color:var(--mut);padding:20px 4px}
.hide{display:none!important}
/* ===== TV mode (only when body.tv) ===== */
body.tv{overflow:hidden;height:100vh}
body.tv .top{position:fixed;left:0;top:0;width:58vw;z-index:30}
body.tv .player{max-height:none}
body.tv main{position:fixed;left:58vw;top:0;right:0;bottom:0;overflow-y:auto;max-width:none;padding:18px 22px 60px}
body.tv .grid{grid-template-columns:repeat(3,1fr)!important;gap:18px 14px}
body.tv .card .n{font-size:17px;height:46px;margin-top:8px}
body.tv .chip{font-size:18px;padding:12px 20px}
body.tv .tot{font-size:22px}
body.tv .fab{display:none!important}
body.tv .ib{font-size:28px;padding:6px 10px}
body.tv .nb{width:64px;height:48px}
body.tv :focus{outline:4px solid var(--or)!important;outline-offset:3px;border-radius:14px}
body.tv .card:focus .lg{transform:scale(1.06);transition:transform .12s}
body.tv.tvfs{overflow:hidden}
body.tv.tvfs .top{inset:0;width:100vw;height:100vh;background:#000;z-index:60;padding:0}
body.tv.tvfs header,body.tv.tvfs .nowbar,body.tv.tvfs .sb,body.tv.tvfs main,body.tv.tvfs .updbar{display:none!important}
body.tv.tvfs .player{width:100vw;height:100vh;aspect-ratio:auto}
</style>
</head>
<body>

function hid(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return"c"+h.toString(36)}
function detectCty(name,group,tvgid){
  const t=(name||"")+" "+(group||"");
  if(t.includes("\u{1F1E7}\u{1F1E9}"))return"BD";
  if(t.includes("\u{1F1EE}\u{1F1F3}"))return"IN";
  const id=(tvgid||"").toLowerCase();
  if(/\.bd$/.test(id))return"BD";
  if(/\.in$/.test(id))return"IN";
  const g=(group||"").toLowerCase();
  if(/bangladesh|\bbd\b/.test(g))return"BD";
  if(/\bindia\b/.test(g))return"IN";
  return guessCty(name)}
function guessCty(name){
  const n=" "+String(name||"").toLowerCase().replace(/\s*[\[(][^\])]*[\])]/g," ")+" ";
  if(/\bstar (plus|sports|gold|utsav|jalsha|pravah|vijay|bharat|movies|world|maa|kiran)|\bzee\b|\bsony\b|colors|&tv|&pictures|\bsab tv|aaj tak|ndtv|\babp\b|news ?18|republic|india tv|tv ?9|doordarshan|\bdd (national|news|sports|bangla)|sun tv|\betv\b|asianet|gemini|mazhavil|surya tv|kairali|udaya|dangal|hungama|\bpogo\b|sonic|b4u|9xm|zing|life ok|jalsha|hindi|tamil|telugu|malayalam|kannada|marathi|punjabi|gujarati|odia|\bten [123]\b|sony ten|willow|\bipl\b/.test(n))return"IN";
  if(/somoy|jamuna|ekattor|ekushey|channel ?i\b|\bntv\b|\brtv\b|\batn\b|\bbtv\b|gazi|t ?sports|\bdbc\b|independent tv|desh tv|nagorik|maasranga|boishakhi|bangla ?vision|channel ?(9|24)|news ?24|my ?tv|asian tv|\bsa tv\b|duronto|deepto|ananda tv|\bgtv\b|bijoy|nexus|banglavision|সময়|এটিএন|একাত্তর/.test(n))return"BD";
  return null}
function parse(text,cty,forceCat){
  const out=[];let meta=null;
  text.split(/\r?\n/).forEach(raw=>{const l=raw.trim();
    if(l.startsWith("#EXTINF")){
      const g=l.match(/group-title="([^"]*)"/);
      const lg=l.match(/tvg-logo="([^"]*)"/);
      const tid=l.match(/tvg-id="([^"]*)"/);const tc=l.match(/tvg-country="([^"]*)"/);
      const i=l.lastIndexOf(",");
      const nm=(i>=0?l.slice(i+1).trim():"")||"Channel";
      meta={name:nm,cat:forceCat||mapCat((g?g[1]:"")+" "+nm),logo:lg?lg[1]:"",cty:detectCty(nm,g?g[1]:"",tid?tid[1]:"")||(tc&&/^(BD|IN)$/i.test(tc[1])?tc[1].toUpperCase():null)};
    }else if(l&&l[0]!=="#"&&meta){out.push({name:meta.name,cat:meta.cat,cty:cty==="AUTO"?meta.cty:cty,url:l,logo:meta.logo});meta=null}
  });
  return out}

function match(k,c){
  if(k==="All")return true;
  if(k==="Favourites")return favs.includes(c.url);
  if(k==="Bangladesh")return c.cty==="BD";
  if(k==="India")return c.cty==="IN";
  if(k==="HTTPS only")return (c.url||"").startsWith("https://");
  return c.cat===k}

let autoDone=false,autoMuted=false,autoSkips=0;const MAX_SKIPS=15;
function autoStart(){
  if(autoDone||cur||!chans.length)return;
  const sid=new URLSearchParams(location.search).get("c");
  const sc=sid&&chans.find(x=>x.id===sid);
  if(sc){autoDone=true;if(!match(tab,sc))tab="All";play(sc,true);

function tryPlay(v){
  v.play().catch(()=>{
    v.muted=true;autoMuted=true;
    v.play().then(()=>toast("Sound off - tap the video, then 🔇 to unmute")).catch(()=>{})})}
function play(c,auto){
  if(!auto){tried=new Set();autoSkips=0;const vv=$("v");if(autoMuted){vv.muted=false;autoMuted=false}}
  tried.add(c.url);
  try{localStorage.setItem(lastKey,c.url)}catch(e){}
  clearTimeout(stallTimer);
  cur=c;const v=$("v");document.body.classList.add("playing");
  $("msg").style.display="none";
  $("now").innerHTML="Playing: <b></b>";$("now").querySelector("b").textContent=c.name;if(TV&&tvfs)toast(c.name);
  if(hls){hls.destroy();hls=null}
  let failed=false;
  const fail=(t,why)=>{const w=why?" ["+why+"]":"";
    if(failed||cur!==c)return;failed=true;clearTimeout(stallTimer);
    const alt=chans.find(x=>baseName(x.name)===baseName(c.name)&&!tried.has(x.url));
    if(alt){toast("Switching to backup: "+alt.name);play(alt,true);return}
    // no backup: automatically try the next channel in the current list
    const list=visible();let i=list.findIndex(x=>x.url===c.url),next=null;
    if(autoSkips<MAX_SKIPS){for(let k=1;k<=list.length;k++){const x=list[(Math.max(i,-1)+k+list.length)%list.length];if(x&&!tried.has(x.url)){next=x;break}}}
    if(next){autoSkips++;toast("Not working: "+c.name+w+" - next: "+next.name);play(next,true);
      setTimeout(()=>{const el=document.querySelector(".card.on");if(el)el.scrollIntoView({block:"center",behavior:"smooth"})},100);return}
    $("msg").style.display="flex";$("msg").textContent=(autoSkips>=MAX_SKIPS?"Many channels are not working. Check your internet or pick a channel.":t)+w};
  const ok=()=>{clearTimeout(stallTimer);autoSkips=0;requestWake()};
  v.onplaying=ok;v.onloadeddata=ok;
  stallTimer=setTimeout(()=>{if(v.readyState<2)fail("Stream is not responding")},15000);
  const httpOnly=location.protocol==="https:"&&c.url.startsWith("http://")&&!INAPP;
  const playUrl=(httpOnly&&PROXY)?PROXY+"/?url="+encodeURIComponent(c.url):c.url;
  const failMsg=(httpOnly&&!PROXY)?"This stream is http-only, which browsers block on https sites. Try another channel or a backup.":"Stream failed to load";
  v.onerror=()=>fail(failMsg,(hlsWhy?"hls: "+hlsWhy+" | ":"")+"media error "+(v.error?v.error.code:"?"));
  let nat=false,hlsWhy="";
  if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(c.url)){
    hls=new Hls();hls.loadSource(playUrl);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>tryPlay(v));
    hls.on(Hls.Events.ERROR,(e,d)=>{if(!d.fatal)return;
      hlsWhy=d.details+(d.response&&d.response.code?" "+d.response.code:"");
      // hls.js failed (often CORS / mixed content): try the phone's own HLS player once
      if(!nat&&v.canPlayType("application/vnd.apple.mpegurl")){nat=true;try{hls.destroy()}catch(x){}hls=null;v.src=playUrl;tryPlay(v);return}
      fail(failMsg,"hls: "+hlsWhy)});
  }else{v.src=playUrl;tryPlay(v)}
  render()}

function step(dir){
  const list=visible();
  if(!list.length)return;
  let i=cur?list.findIndex(c=>c.url===cur.url):-1;
  if(i<0)i=dir>0?-1:0;
  play(list[(i+dir+list.length)%list.length]);
  const el=document.querySelector(".card.on");
  if(el)el.scrollIntoView({block:"center",behavior:"smooth"})}
function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}
  return new Promise((ok,no)=>{try{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();const r=document.execCommand("copy");a.remove();r?ok():no()}catch(e){no(e)}})}

function setFs(on){

  tvfs=on;document.body.classList.toggle("tvfs",on);
  $("v").controls=!on;
  if(on){try{history.pushState({fs:1},"")}catch(e){}if(cur)toast(cur.name)}
  else{try{if(history.state&&history.state.fs)history.back()}catch(e){}tvRestore()}}
function tvFav(url){
  const c=chans.find(x=>x.url===url);if(!c)return;
  const i=favs.indexOf(url);if(i>-1)favs.splice(i,1);else favs.push(url);
  saveFavs();render();toast((i>-1?"♡ Removed: ":"♥ Favourite: ")+c.name)}
let enterT=0,enterLong=false;
function tvRestore(){
  if(!TV||tvfs)return;
  const a=document.activeElement;if(a&&a!==document.body)return;
  const all=[...document.querySelectorAll("[data-fk]")];
  const t=(lastFk&&all.find(e=>e.dataset.fk===lastFk))||document.querySelector(".card.on")||document.querySelector(".card");
  if(t)t.focus()}
function tvNav(dir){
  const els=[...document.querySelectorAll("[data-fk],header .ib,.nowbar .nb,.player")].filter(e=>e.getClientRects().length&&!(e.classList&&e.classList.contains("fv")));
  const a=document.activeElement;
  if(!a||!els.includes(a)){const f=els.find(e=>e.classList.contains("card"))||els[0];if(f)f.focus();return}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e12;
  for(const e of els){if(e===a)continue;
    const q=e.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
    let p,o;
    if(dir==="ArrowRight"){if(dx<=4)continue;p=dx;o=Math.abs(dy)}
    else if(dir==="ArrowLeft"){if(dx>=-4)continue;p=-dx;o=Math.abs(dy)}
    else if(dir==="ArrowDown"){if(dy<=4)continue;p=dy;o=Math.abs(dx)}
    else{if(dy>=-4)continue;p=-dy;o=Math.abs(dx)}
    const sc=p+o*2.5;if(sc<bs){bs=sc;best=e}}
  if(best)best.focus()}
if(TV){
  document.addEventListener("focusin",e=>{const f=e.target.closest&&e.target.closest("[data-fk]");if(f)lastFk=f.dataset.fk});
  window.addEventListener("popstate",()=>{if(tvfs){tvfs=false;document.body.classList.remove("tvfs");$("v").controls=true;tvRestore()}});
  document.querySelector(".player").tabIndex=0;
  document.addEventListener("keyup",e=>{
    if(e.key!=="Enter"||tvfs)return;
    const t=e.target;
    if(t&&t.classList&&t.classList.contains("card")){e.preventDefault();if(!enterLong)t.click();enterLong=false}});
  const hint=document.createElement("div");
  hint.style.cssText="font-size:14px;color:var(--mut);margin:-4px 2px 10px";
  hint.textContent="OK = play  |  hold OK = ♥ favourite  |  Back = exit fullscreen";
  $("tot").after(hint);
  document.addEventListener("keydown",e=>{
    const v=$("v");
    if(autoMuted){v.muted=false;autoMuted=false}
    const t=e.target,typing=t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
    const k=e.key,kc=e.keyCode;
    if(k==="Escape"||k==="GoBack"||k==="BrowserBack"||kc===4||(k==="Backspace"&&!typing)){
      if(tvfs){e.preventDefault();setFs(false)}return}
    if(k==="ColorF0Red"||k==="ColorF2Yellow"||kc===403||kc===405||k==="f"||k==="F"){
      const fc=t&&t.dataset&&t.dataset.fk&&t.dataset.fk.startsWith("u:")?t.dataset.fk.slice(2):(cur&&cur.url);
      if(fc){e.preventDefault();tvFav(fc)}return}
    if(tvfs){
      if(k==="ArrowUp"||k==="ChannelUp"||kc===427){e.preventDefault();step(-1)}
      else if(k==="ArrowDown"||k==="ChannelDown"||kc===428){e.preventDefault();step(1)}
      else if(k==="Enter"||k===" "||k==="MediaPlayPause"){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause()}
      return}
    if(typing)return;
    if(k==="ArrowUp"||k==="ArrowDown"||k==="ArrowLeft"||k==="ArrowRight"){e.preventDefault();tvNav(k)}
    else if(k==="Enter"){
      if(t&&t.classList.contains("card")){
        e.preventDefault();
        if(!e.repeat){enterT=Date.now();enterLong=false}
        else if(!enterLong&&Date.now()-enterT>600){enterLong=true;tvFav(t.dataset.fk.slice(2))}}
      else if(t&&t.classList.contains("player")){e.preventDefault();if(cur)setFs(true)}}
    else if(k==="ChannelUp"||kc===427){step(-1)}
    else if(k==="ChannelDown"||kc===428){step(1)}
  });
}

// ===== Database helpers (iptv-org: public channel list with countries and logos) =====
const dbCache={};
async function getDb(name){
  if(!dbCache[name]){
    const r=await fetch("https://iptv-org.github.io/api/"+name+".json");
    if(!r.ok)throw new Error(name+" download failed");
    dbCache[name]=await r.json()}
  return dbCache[name]}
const normName=s=>(s||"").toLowerCase().replace(/\[[^\]]*\]|\([^)]*\)/g,"").replace(/[^\p{L}\p{N}]/gu,"");
const stripTv=k=>{let r=k;while(/(tv|hd)$/.test(r)&&r.length>3)r=r.replace(/(tv|hd)$/,"");return r};
const digitsOf=k=>(k.match(/\d+/g)||[]).join("-");
function editDist(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];}
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]}
function buildLogoMatcher(chs,lgs){
  const best={};
  (lgs||[]).forEach(l=>{
    if(!l.url||!/^https:\/\//.test(l.url))return;
    const o=best[l.channel];
    if(!o||(o.format==="SVG"&&l.format!=="SVG"))best[l.channel]=l});
  const idx=new Map(),keys=[];
  const add=(k,ch)=>{if(!k||k.length<2)return;const a=idx.get(k);if(a)a.push(ch);else{idx.set(k,[ch]);keys.push(k)}};
  chs.forEach(ch=>{
    [ch.name].concat(ch.alt_names||[]).forEach(n=>{const k=normName(n);add(k,ch);const t=stripTv(k);if(t!==k)add(t,ch)})});
  return function(name,cty){
    const k=normName(name),t=stripTv(k);
    if(!k)return null;
    let arr=idx.get(k)||idx.get(t),exact=!!arr;
    if(!arr&&k.length>=7){
      for(const key of keys){
        if(key[0]!==k[0]||Math.abs(key.length-k.length)>1)continue;
        if(digitsOf(key)!==digitsOf(k))continue;
        if(editDist(key,k)<=1){arr=idx.get(key);break}}}
    if(!arr)return null;
    const wl=arr.filter(x=>best[x.id]);
    const pl=wl.find(x=>x.country===cty)||wl[0];
    const cs=Array.from(new Set(arr.map(x=>x.country)));
    return {logo:pl?best[pl.id].url:null,country:cs.length===1?cs[0]:null,exact}}}

// ===== Check streams and remove channels that cannot load =====
async function checkStream(c,ms){
  const isHttp=/^http:\/\//i.test(c.url);
  if(isHttp&&!PROXY)return false;
  if(!/\.m3u8/i.test(c.url))return true; // only HLS (.m3u8) streams can be tested from the browser
  const wrap=u=>(/^http:\/\//i.test(u)&&PROXY)?PROXY+"/?url="+encodeURIComponent(u):u;
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),ms);
  try{
    let u=wrap(c.url);
    for(let depth=0;depth<3;depth++){
      const r=await fetch(u,{signal:ctl.signal});
      if(!r.ok)return false;
      const t=await r.text();
      if(!t.includes("#EXTM3U"))return false;
      const line=t.split(/\r?\n/).map(x=>x.trim()).find(x=>x&&x[0]!=="#");
      if(!line)return false;
      const next=new URL(line,u).toString();
      if(t.includes("#EXT-X-STREAM-INF")||/\.m3u8/i.test(line)){u=wrap(next);continue}
      const sg=await fetch(wrap(next),{signal:ctl.signal});
      const ok=sg.ok;
      if(sg.body)sg.body.cancel();
      return ok}
    return true;
  }catch(e){return false}
  finally{clearTimeout(timer)}}

  (async()=>{
    for(const [n,g,st] of VOL){const P=plug(n);if(!P)continue;try{sysV=await g(P);vAPI={P,g,st};break}catch(e){}}
    if(NB){try{sysB=readB(await NB.getBrightness());nbOk=true}catch(e){nbOk=false}}
    if(!nbOk&&br!==1)v.style.filter="brightness("+br+")";
  })();
  const prime=()=>{
    if(vAPI)vAPI.g(vAPI.P).then(x=>{sysV=x}).catch(()=>{});
    if(nbOk)NB.getBrightness().then(r=>{sysB=readB(r)}).catch(()=>{})};
  let ht;
  const show=(ic,pct,fr)=>{
    hud.innerHTML=ic+' <i><b style="width:'+Math.round(Math.max(0,Math.min(1,fr))*100)+'%"></b></i> '+Math.round(pct*100)+'%';
    hud.classList.add("on");clearTimeout(ht);ht=setTimeout(()=>hud.classList.remove("on"),900)};
  let pv=null,pb=null,lt=0;
  const flush=()=>{
    if(pv!==null&&vAPI)vAPI.st(vAPI.P,pv).catch(()=>{});
    if(pb!==null&&nbOk)NB.setBrightness({brightness:pb}).catch(()=>{nbOk=false});
    pv=pb=null;lt=Date.now()};
  const active=()=>body.classList.contains("land")||document.fullscreenElement||document.webkitFullscreenElement;
  let g=null;
  p.addEventListener("touchstart",e=>{
    if(!active()||e.touches.length!==1||(e.target.closest&&e.target.closest(".pbtn,.cbar"))){g=null;return}
    const t=e.touches[0],r=p.getBoundingClientRect();
    if(t.clientY>r.bottom-r.height*.2){g=null;return}
    prime();
    g={x:t.clientX,y:t.clientY,side:(t.clientX-r.left)<r.width/2?"b":"v",on:false,h:r.height}
  },{passive:true});
  p.addEventListener("touchmove",e=>{
    if(!g)return;
    const t=e.touches[0],dy=g.y-t.clientY,dx=t.clientX-g.x;
    if(!g.on){
      if(Math.abs(dy)<14||Math.abs(dy)<Math.abs(dx)*1.5){if(Math.abs(dx)>14)g=null;return}
      g.on=true;
      g.v0=vAPI&&sysV!==null?sysV:v.volume;
      g.b0=nbOk&&sysB!==null?sysB:br}
    e.preventDefault();
    const f=dy/(g.h*.7);
    if(g.side==="v"){
      const x=Math.max(0,Math.min(1,g.v0+f));
      v.muted=false;
      if(vAPI){v.volume=1;pv=x}else v.volume=x;
      show(x===0?"🔇":"🔊",x,x)
    }else if(nbOk){
      const x=Math.max(.02,Math.min(1,g.b0+f));pb=x;show("☀",x,x)
    }else{cssBr(g.b0+f*1.35);show("☀",br,br/1.5)}
    if(Date.now()-lt>40)flush()
  },{passive:false});
  ["touchend","touchcancel"].forEach(n=>p.addEventListener(n,()=>{if(g&&g.on)flush();g=null},{passive:true}));
})();

(function(){
  const body=document.body;
  const chk=()=>{if(window.innerHeight>320)body.classList.remove("pip")};
  let imm=false;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const immersive=async on=>{
    try{const sb=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.StatusBar;if(sb)on?sb.hide():sb.show()}catch(e){}
    try{const d=document,e=d.documentElement;
      if(on&&!fsEl()){imm=true;await (e.requestFullscreen?e.requestFullscreen({navigationUI:"hide"}):e.webkitRequestFullscreen())}
      else if(!on&&fsEl()){imm=false;await (d.exitFullscreen?d.exitFullscreen():d.webkitExitFullscreen())}
    }catch(er){imm=false}};
  const land=()=>{
    const l=window.innerWidth>window.innerHeight&&window.innerHeight<=500;
    body.classList.toggle("land",l);document.documentElement.classList.toggle("land",l);
    if(!l&&imm)immersive(false)};
  // browsers need a tap before fullscreen is allowed: first tap in landscape while playing
  document.addEventListener("click",ev=>{if(ev.target.closest&&ev.target.closest(".pbtn,.cbar"))return;if(body.classList.contains("land")&&body.classList.contains("playing")&&!fsEl())immersive(true)},true);
  ["resize","focus","pageshow","click","touchstart"].forEach(e=>window.addEventListener(e,chk,{passive:true}));
  ["resize","orientationchange","pageshow"].forEach(e=>window.addEventListener(e,land));
  document.addEventListener("visibilitychange",chk);chk();land();
  // video fullscreen button -> rotate to landscape (and back)
  // lock helper: plugin first, then the browser API
  const setLock=async t=>{
    try{
      const C=window.Capacitor;
      if(C&&C.Plugins&&C.Plugins.ScreenOrientation){await C.Plugins.ScreenOrientation.lock({orientation:t});return}
      if(C&&C.nativePromise){await C.nativePromise("ScreenOrientation","lock",{orientation:t});return}
    }catch(e){}
    try{await screen.orientation.lock(t)}catch(e){}
  };
  const setUnlock=async()=>{
    try{
      const C=window.Capacitor;
      if(C&&C.Plugins&&C.Plugins.ScreenOrientation){await C.Plugins.ScreenOrientation.unlock();return}
      if(C&&C.nativePromise){await C.nativePromise("ScreenOrientation","unlock",{});return}
    }catch(e){}
    try{screen.orientation.unlock()}catch(e){}
  };
  // after locking to landscape, follow the phone: top-left = landscape-primary, top-right = landscape-secondary
  let side="";
  const follow=e=>{
    const g=e.gamma;if(g==null)return;
    const want=g<-55?"landscape-primary":g>55?"landscape-secondary":"";
    if(!want||want===side)return;
    side=want;setLock(want);
  };
  const rot=async l=>{
    window.removeEventListener("deviceorientation",follow);
    if(l){side="";await setLock("landscape");window.addEventListener("deviceorientation",follow)}
    else await setUnlock();
  };
  const fsChange=()=>{if(imm){if(!fsEl())imm=false;return}rot(!!fsEl())};
  document.addEventListener("fullscreenchange",fsChange);
  document.addEventListener("webkitfullscreenchange",fsChange);
  const vv=document.getElementById("v");
  vv.addEventListener("webkitbeginfullscreen",()=>rot(true));
  vv.addEventListener("webkitendfullscreen",()=>rot(false));
  // update bar (only inside the Android app)
  const m=navigator.userAgent.match(/AkashApp\/(\d+)/);if(!m)return;const cur=+m[1];
  fetch("https://api.github.com/repos/bayazid18ir100-web/akash-stream/releases/latest").then(r=>r.json()).then(j=>{
    const n=parseInt(String(j.tag_name||"").replace(/\D/g,""),10);
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    if(!a||!(n>cur))return;
    const b=document.createElement("div");b.className="updbar";
    b.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:#0e1f45;border:1px solid #22d3ee;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between";
    const t=document.createElement("span");t.textContent="নতুন আপডেট এসেছে";
    const u=document.createElement("button");u.className="chip on";u.textContent="আপডেট করুন";
    u.onclick=()=>{location.href=a.browser_download_url};
    b.append(t,u);body.appendChild(b);
  }).catch(()=>{});
})();

  try{
    const r=await fetch("config.json",{cache:"no-store"});const j=await r.json();
    const u=String(j.support||"").trim();
    if(!/^https:\/\/(t\.me|telegram\.me)\//i.test(u))return;

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
