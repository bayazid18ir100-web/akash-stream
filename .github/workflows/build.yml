name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          for f in index.html logo.svg icon.svg icon-192.png manifest.json; do
            [ -f "$f" ] && cp "$f" www/ || true
          done
          rm -f www/manifest.json

      - name: Set app version
        run: sed -i "s|AkashApp/1|AkashApp/${{ github.run_number }}|" capacitor.config.json

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Make app icon and splash screen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p assets
          SRC=icon.svg
          [ -f "$SRC" ] || SRC=logo.svg
          rsvg-convert -a -w 820 -h 820 "$SRC" -o /tmp/ic.png
          rsvg-convert -a -w 640 -h 640 "$SRC" -o /tmp/fg.png
          rsvg-convert -a -w 900 -h 900 "$SRC" -o /tmp/sp.png
          convert -size 1024x1024 "xc:#07122b" /tmp/ic.png -gravity center -composite assets/icon-only.png
          convert -size 1024x1024 xc:none /tmp/fg.png -gravity center -composite assets/icon-foreground.png
          convert -size 1024x1024 "xc:#07122b" assets/icon-background.png
          convert -size 2732x2732 "xc:#07122b" /tmp/sp.png -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#07122b' --splashBackgroundColor '#07122b'

      - name: Enable Picture-in-Picture, background play, fullscreen and share sheet
        run: |
          MAIN=android/app/src/main/java/com/akash/stream/MainActivity.java
          cat > "$MAIN" <<'EOF'
          package com.akash.stream;

          import android.app.PictureInPictureParams;
          import android.content.res.Configuration;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Rational;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AkashSharePlugin.class);
              super.onCreate(savedInstanceState);
              getWindow().setBackgroundDrawable(new ColorDrawable(Color.BLACK));
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              applyBars();
            }

            @Override
            public void onConfigurationChanged(Configuration newConfig) {
              super.onConfigurationChanged(newConfig);
              applyBars();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) applyBars();
            }

            private void applyBars() {
              boolean land = getResources().getConfiguration().orientation == Configuration.ORIENTATION_LANDSCAPE;
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              if (c == null) return;
              if (land) {
                c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                c.hide(WindowInsetsCompat.Type.systemBars());
              } else {
                c.show(WindowInsetsCompat.Type.systemBars());
              }
            }

            @Override
            public void onUserLeaveHint() {
              super.onUserLeaveHint();
              if (Build.VERSION.SDK_INT >= 26) {
                AudioManager am = (AudioManager) getSystemService(AUDIO_SERVICE);
                if (am != null && am.isMusicActive()) {
                  try {
                    PictureInPictureParams params = new PictureInPictureParams.Builder()
                        .setAspectRatio(new Rational(16, 9))
                        .build();
                    enterPictureInPictureMode(params);
                  } catch (Exception e) {
                  }
                }
              }
            }

            @Override
            public void onPictureInPictureModeChanged(boolean isInPip, Configuration newConfig) {
              super.onPictureInPictureModeChanged(isInPip, newConfig);
              WebView w = getBridge().getWebView();
              if (w != null) {
                w.evaluateJavascript(
                    "document.body.classList.toggle('pip'," + (isInPip ? "true" : "false") + ")",
                    null);
              }
            }

            @Override
            public void onPause() {
              super.onPause();
              WebView w = getBridge().getWebView();
              if (w != null) {
                w.onResume();
                w.resumeTimers();
              }
            }
          }
          EOF
          cat > android/app/src/main/java/com/akash/stream/AkashSharePlugin.java <<'EOF'
          package com.akash.stream;

          import android.content.Intent;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AkashShare")
          public class AkashSharePlugin extends Plugin {

            @PluginMethod
            public void share(final PluginCall call) {
              final String title = call.getString("title", "Share");
              final String text = call.getString("text", "");
              getActivity().runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  try {
                    Intent i = new Intent(Intent.ACTION_SEND);
                    i.setType("text/plain");
                    i.putExtra(Intent.EXTRA_SUBJECT, title);
                    i.putExtra(Intent.EXTRA_TEXT, text);
                    getActivity().startActivity(Intent.createChooser(i, title));
                    call.resolve();
                  } catch (Exception e) {
                    call.reject("share failed");
                  }
                }
              });
            }
          }
          EOF
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:supportsPictureInPicture="true"|' "$MF"
          grep -q supportsPictureInPicture "$MF"

      - name: Allow http (cleartext) streams
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if grep -q usesCleartextTraffic "$MF"; then
            sed -i 's|android:usesCleartextTraffic="[a-z]*"|android:usesCleartextTraffic="true"|' "$MF"
          else
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MF"
          fi
          grep -q 'usesCleartextTraffic="true"' "$MF"

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk akash-stream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: akash-stream-apk
          path: akash-stream.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Akash Stream v${{ github.run_number }}
          files: akash-stream.apk
          make_latest: true
